{{- $path := .Get "src" -}}
{{- $class := .Get "class" -}}
{{- $svg := .Page.Resources.Get $path -}}
{{- $width := .Get "width" | default "100%" -}}

{{- with $svg -}}
  {{- $content := .Content -}}
  <div class="svg-inline{{ with $class }} {{ . }}{{ end }}" {{ printf "style=%q" (printf "--svg-width: %s;" $width) | safeHTMLAttr }}>
    {{ $content | safeHTML }}
  </div>
{{- else -}}
  <p style="color:red;">Error: SVG "<strong>{{ $path }}</strong>" not found</p>
{{- end -}}
